name: CampusFlow AI System Verification CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-system:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Initialize Database
        run: |
          python database/imports/import_dataset.py --dataset datasets/auro_demo

      - name: Train PyTorch PPO Agent
        run: |
          python train_rl.py

      - name: Generate Research Evidence Artifacts
        run: |
          python generate_evidence.py

      - name: Run Automated Verification Suite
        run: |
          python verify_project.py

      - name: Upload Trained Models & Evidence Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: campusflow-ai-artifacts
          path: |
            rl/models/
            rl/logs/
            rl/evaluation/
