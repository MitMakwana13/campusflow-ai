name: CampusFlow AI System Verification CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-system:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install torch gymnasium stable-baselines3 fastapi uvicorn sqlalchemy

      - name: Initialize Database
        run: |
          python database/imports/import_dataset.py --dataset datasets/auro_demo

      - name: Train PyTorch PPO Agent
        run: |
          python train_rl.py

      - name: Run Automated Verification Suite
        run: |
          python verify_project.py
