name: CampusFlow AI Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Validator & API Unit Tests
        working-directory: ./backend
        run: python -m pytest tests/ -v

      - name: Run Dataset Schema Validator
        working-directory: ./backend
        run: python app/importer/validate_dataset.py

      - name: Run Model Policy Regression Gate
        working-directory: ./backend
        run: python app/optimizer/regression.py

      - name: Run Frontend Production Build
        working-directory: ./frontend
        run: npm run build
