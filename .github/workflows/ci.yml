name: CampusFlow AI Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-and-api-tests:
    name: Backend Unit & REST API Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest
      - working-directory: ./backend
        run: python -m pytest tests/ -v

  dataset-and-regression-checks:
    name: Dataset Validator & Model Policy Regression Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - working-directory: ./backend
        run: python app/importer/validate_dataset.py
      - working-directory: ./backend
        run: python app/optimizer/regression.py

  frontend-build:
    name: Next.js Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: ./frontend
        run: npm ci
      - working-directory: ./frontend
        run: npm run build
